name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - name: Generated Worker types are current
        run: |
          pnpm --filter @donext/worker types
          git diff --exit-code -- apps/worker/worker-configuration.d.ts
      - run: pnpm typecheck
      - run: pnpm test
      # Builds the web assets and bundles the Worker with a dry-run deploy, which also
      # validates wrangler.jsonc.
      - run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm --filter @donext/e2e exec playwright install --with-deps chromium
      # Builds the web app and serves it with `wrangler dev`, as configured in e2e/playwright.config.ts.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
