name: Deploy

# One run per merge to master: build once, ship that build to staging,
# wait for approval on the production environment, then ship the same build.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.149.0 # keep in sync with apps/api/package.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Assemble release
        run: |
          mkdir -p release/api release/web
          cp -r apps/api/dist apps/api/migrations apps/api/wrangler.jsonc release/api/
          cp -r apps/web/dist release/web/
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          if-no-files-found: error

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://donext-staging.orben.dev
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply D1 migrations
        working-directory: release/api
        run: npx --yes wrangler@$WRANGLER_VERSION d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        working-directory: release/api
        run: npx --yes wrangler@$WRANGLER_VERSION deploy dist/index.js --no-bundle --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            body=$(curl -fsS https://donext-staging.orben.dev/api/health || true)
            echo "$body" | grep -q '"environment":"staging"' && echo "$body" && exit 0
            sleep 10
          done
          echo "Health check failed for https://donext-staging.orben.dev" && exit 1

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://donext.orben.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply D1 migrations
        working-directory: release/api
        run: npx --yes wrangler@$WRANGLER_VERSION d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        working-directory: release/api
        run: npx --yes wrangler@$WRANGLER_VERSION deploy dist/index.js --no-bundle --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          for attempt in $(seq 1 12); do
            body=$(curl -fsS https://donext.orben.dev/api/health || true)
            echo "$body" | grep -q '"environment":"production"' && echo "$body" && exit 0
            sleep 10
          done
          echo "Health check failed for https://donext.orben.dev" && exit 1
